services:
  plc-db:
    image: postgres:18
    environment:
      POSTGRES_USER: plc
      POSTGRES_PASSWORD: plc
      POSTGRES_DB: plc
    volumes:
      - plc-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plc -d plc"]
      interval: 2s
      timeout: 2s
      retries: 30

  plc:
    build:
      context: "https://github.com/did-method-plc/did-method-plc.git#9c8ea2fe23b89a5c1011246cbb4957dad9dbf7db"
      dockerfile: packages/server/Dockerfile
    depends_on:
      plc-db:
        condition: service_healthy
    environment:
      DB_CREDS_JSON: '{"username":"plc","password":"plc","host":"plc-db","port":"5432","database":"plc"}'
      DB_MIGRATE_CREDS_JSON: '{"username":"plc","password":"plc","host":"plc-db","port":"5432","database":"plc"}'
      ENABLE_MIGRATIONS: "true"
      PORT: "2582"
    ports:
      - "127.0.0.1:2582:2582"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2582/_health"]
      interval: 2s
      timeout: 2s
      retries: 150

  pds:
    image: ghcr.io/bluesky-social/pds:0.4
    depends_on:
      plc:
        condition: service_healthy
    environment:
      PDS_HOSTNAME: pds.localhost
      PDS_SERVICE_HANDLE_DOMAINS: .test
      PDS_DEV_MODE: "true"
      PDS_DID_PLC_URL: http://plc:2582
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      PDS_INVITE_REQUIRED: "false"
      PDS_ADMIN_PASSWORD: admin
      PDS_JWT_SECRET: a16bfdfe2386d17a700c9bdd48b3533abeda3b521eb8e5f2ac0b632f59dc0ae6
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: 23b4faa8a8d684c8c8a99084078fa73aac565ad4575ab04a00b0938cdf98af50
      LOG_ENABLED: "true"
    volumes:
      - pds:/pds
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/xrpc/_health"]
      interval: 2s
      timeout: 2s
      retries: 150

  caddy:
    image: caddy:2
    depends_on:
      pds:
        condition: service_healthy
    # The healthcheck reaches the proxy under the name it serves.
    extra_hosts:
      - "pds.localhost:127.0.0.1"
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://pds.localhost/xrpc/_health"]
      interval: 2s
      timeout: 2s
      retries: 150

volumes:
  plc-db:
  pds:
  caddy:
