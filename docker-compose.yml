# A local atproto network for manual end-to-end runs: a PLC directory, a PDS, and a TLS reverse proxy
# in front of the PDS, since OAuth clients only talk to auth servers over https without a port.
# Nothing here points at the real network, and the published ports are bound to loopback only, since
# the PDS has open signup and a known admin password. Data lives under ./local, which git ignores.
#
# See the "Local atproto network" section in the README for how to use it.

services:
  plc-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plc
      POSTGRES_PASSWORD: plc
      POSTGRES_DB: plc
    volumes:
      - ./local/plc-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plc -d plc"]
      interval: 2s
      timeout: 2s
      retries: 30

  plc:
    image: ghcr.io/bluesky-social/did-method-plc:plc-f2ab7516bac5bc0f3f86842fa94e996bd1b3815b
    # The published image is amd64 only; on Apple silicon it runs under emulation, which is fine for a
    # directory that sees a handful of requests.
    platform: linux/amd64
    depends_on:
      plc-db:
        condition: service_healthy
    environment:
      DB_CREDS_JSON: '{"username":"plc","password":"plc","host":"plc-db","port":"5432","database":"plc"}'
      DB_MIGRATE_CREDS_JSON: '{"username":"plc","password":"plc","host":"plc-db","port":"5432","database":"plc"}'
      ENABLE_MIGRATIONS: "true"
      PORT: "2582"
    ports:
      - "127.0.0.1:2582:2582"

  pds:
    image: ghcr.io/bluesky-social/pds:0.4
    depends_on:
      - plc
    environment:
      PDS_HOSTNAME: pds.localhost
      PDS_SERVICE_HANDLE_DOMAINS: .test
      PDS_DEV_MODE: "true"
      PDS_DID_PLC_URL: http://plc:2582
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      PDS_BLOB_UPLOAD_LIMIT: "314572800"
      PDS_INVITE_REQUIRED: "false"
      PDS_ADMIN_PASSWORD: admin
      # Dev-only secrets for a network that never leaves this machine.
      PDS_JWT_SECRET: a16bfdfe2386d17a700c9bdd48b3533abeda3b521eb8e5f2ac0b632f59dc0ae6
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: 23b4faa8a8d684c8c8a99084078fa73aac565ad4575ab04a00b0938cdf98af50
      LOG_ENABLED: "true"
    volumes:
      - ./local/pds:/pds

  caddy:
    image: caddy:2
    depends_on:
      - pds
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./local/caddy:/data
